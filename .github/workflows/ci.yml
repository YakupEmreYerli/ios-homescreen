name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - name: Every command's --help runs from the installed entry point
        run: |
          uv run ios-homescreen --help > /dev/null
          for command in pull check push editor backups restore wifi; do
            uv run ios-homescreen "$command" --help > /dev/null
          done
      - name: The wheel carries the browser editor's files
        run: |
          uv build --wheel --out-dir dist
          uv run python - <<'PY'
          import glob, zipfile
          names = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          for needed in ("index.html", "app.css", "favicon.png", "logo.png", "js/main.js", "vendor/preact.mjs"):
              assert f"ios_homescreen/ui/static/{needed}" in names, needed
          PY
