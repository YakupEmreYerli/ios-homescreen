name: Desktop apps

# Builds the desktop app for macOS (.dmg), Windows (installer .exe) and Linux (AppImage).
# Every build starts the packaged app once in self-test mode. A tag push attaches the
# files to that tag's GitHub release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/ios_homescreen/desktop.py"
      - ".github/workflows/apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-14
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Linux libraries for Qt and AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libasound2 libfuse2

      - run: uv sync --locked --extra app --group package
      - run: uv run python packaging/make_icons.py
      - run: uv run pyinstaller packaging/ios-homescreen.spec --noconfirm

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(uv run python -c 'import ios_homescreen; print(ios_homescreen.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Self-test and .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/ios-homescreen.app/Contents/MacOS/ios-homescreen --self-test
          mkdir -p out
          hdiutil create -volname ios-homescreen -srcfolder dist/ios-homescreen.app -ov \
            -format UDZO "out/ios-homescreen-${{ steps.version.outputs.value }}-macos-arm64.dmg"

      - name: Self-test and installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $test = Start-Process -FilePath dist\ios-homescreen\ios-homescreen.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "self-test failed: $($test.ExitCode)" }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.value }} packaging\windows.iss

      - name: Self-test and AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/ios-homescreen/ios-homescreen --self-test
          packaging/appimage.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-homescreen-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
